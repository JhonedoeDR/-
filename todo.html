<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Todo</title>
<link rel="stylesheet" href="./style.css" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<meta name="theme-color" content="#faf8f3" />
</head>
<body>
<div class="lm-page">
<a class="lm-back-link" href="./index.html">← 今日のページに戻る</a>
<h1 class="lm-date-header">Todo</h1>
<p class="lm-sub-header">「メインに設定」した最大3件がホームに表示されます</p>
<section class="lm-section" style="border-top:none;">
<div class="lm-section-title">タスクを追加</div>
<form id="task-form" style="display:flex; gap:8px;">
<input id="f-task-text" placeholder="タスクを入力" style="flex:1; min-width:0; font-family:var(--font-body); font-size:16px; padding:8px 10px; border:1px solid var(--paper-line); border-radius:8px;" required />
<button type="submit" class="lm-btn secondary" style="padding:8px 14px;">追加</button>
</form>
</section>
<section class="lm-section">
<div class="lm-section-title">
タスク一覧
<span class="lm-count" id="tasks-count"></span>
</div>
<div id="tasks-list"></div>
</section>
<div id="nav-container"></div>
</div>
<script src="./app.js"></script>
<script src="./todo.js"></script>
</body>
</html>
