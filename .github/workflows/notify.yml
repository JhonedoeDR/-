name: Notify Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    name: Run check
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup code
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run install
        run: npm install firebase-admin
      - name: Run node
        run: node scripts/notify-check.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
